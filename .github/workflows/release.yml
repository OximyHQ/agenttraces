name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check registry version
        id: registry
        working-directory: apps/cli
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npx --yes npm@12.0.2 view "agenttraces@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish agenttraces
        if: steps.registry.outputs.published != 'true'
        working-directory: apps/cli
        run: npx --yes npm@12.0.2 publish --provenance --access public --tag "${{ inputs.npm_tag || 'latest' }}"
      - name: Report existing release
        if: steps.registry.outputs.published == 'true'
        run: echo "agenttraces@${{ steps.registry.outputs.version }} is already published; skipping."
